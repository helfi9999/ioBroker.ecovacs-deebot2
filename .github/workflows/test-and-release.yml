name: Test and Release

on:
  push:
    branches:
      - "main"
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-**"
  pull_request: {}
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read

jobs:
  check-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:package

  adapter-tests:
    needs: check-and-lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:integration
      - name: Diagnose integration test installation
        if: failure()
        shell: bash
        run: |
          TEST_DIR="$(node -p 'require("node:path").join(require("node:os").tmpdir(), "test-iobroker.ecovacs-deebot2")')"
          echo "=== Test directory: $TEST_DIR ==="
          ls -la "$TEST_DIR" 2>&1 || true
          echo "=== Installed adapter ==="
          ls -la "$TEST_DIR/node_modules/iobroker.ecovacs-deebot2" 2>&1 || true
          echo "=== Adapter metadata ==="
          cat "$TEST_DIR/node_modules/iobroker.ecovacs-deebot2/package.json" 2>&1 || true
          echo "=== Installed controller ==="
          ls -ld "$TEST_DIR/node_modules/iobroker.js-controller" 2>&1 || true
          echo "=== Test package dependencies ==="
          cat "$TEST_DIR/package.json" 2>&1 || true
      - run: npm pack --dry-run

  deploy:
    if: >-
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v')
    needs: [check-and-lint, adapter-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify release tag matches package version
        shell: bash
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          test "$GITHUB_REF" = "refs/tags/v${PACKAGE_VERSION}"
      - uses: ioBroker/testing-action-deploy@v1
        with:
          node-version: "24.x"
          build: "true"
          github-token: ${{ secrets.GITHUB_TOKEN }}
